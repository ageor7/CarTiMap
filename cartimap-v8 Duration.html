<style id="global-styles">
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap');

/* --- [ SubBlock: Root & Base ] --- */
:root { --bg: #fcfcfc; --paneBg: #fcfcfc; --border: #ccc; --text: #222; --accent: #007acc; }

*, *::before, *::after { box-sizing: inherit; }

/* Absolute hardware lock + rigid width/height limits to kill bleed */
#tm-root { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; max-width: 100%; max-height: 100%; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }

/* --- [ SubBlock: Layout & Resizers ] --- */

/* Maximize Panes Matrix */

              const isVip = item.priority && item.priority.toLowerCase() === 'vip';

                if (!rawStr) return [];
                const initialParts = String(rawStr).split(/<br\s*\/?>|\r?\n|\|/i).map(s => s.trim()).filter(Boolean);
                const finalParts = [];
                const wktKeywordRe = /\b(?:POINT|LINESTRING|POLYGON|MULTIPOINT|MULTILINESTRING|MULTIPOLYGON)\b\s*\(/gi;
                initialParts.forEach(part => {
                  if (/^\s*GEOMETRYCOLLECTION\b/i.test(part)) {

                  } else {
                    const matches = [];
                    let m;
                    wktKeywordRe.lastIndex = 0;
                    while ((m = wktKeywordRe.exec(part)) !== null) {
                      matches.push(m.index);
                    }
                    if (matches.length <= 1) {
                      finalParts.push(part);
                    } else {
                      let depth = 0;
                      let start = 0;
                      for (let i = 0; i < part.length; i++) {
                        if (part[i] === '(') depth++;
                        else if (part[i] === ')') depth--;
                        if (depth === 0 && matches.includes(i + 1)) {
                          const sub = part.substring(start, i + 1).trim();
                          if (sub) finalParts.push(sub);
                          start = i + 1;
                        }
                      }
                      const lastSub = part.substring(start).trim();
                      if (lastSub) finalParts.push(lastSub);
                    }
                  }
                });

          useEffect(() => {

                  // Inactive non-VIP markers return to clusterLayer for spatial decluttering.

                              const cx = p1.x + 0.5 * (p2.x - p1.x);

                              const arrowMarker = L.marker(latLng, {

                          }

                  });

            };

              map.off('zoomend moveend', renderChevrons);
            };
          }, [activeIndex, polygonOpacity, data]);

          useEffect(() => {

          });
          const basesRaw = basemapsRegistry ? sortAlpha(basemapsRegistry.filter(b => (b.type || 'base').toLowerCase() !== 'overlay')) : [];
          const bases = basesRaw.filter((b, idx, arr) => arr.findIndex(x => x.id === b.id || (x.id === 'no-basemap' && b.id === 'none') || (x.id === 'none' && b.id === 'no-basemap')) === idx);
          const overlays = basemapsRegistry ? sortAlpha(basemapsRegistry.filter(b => (b.type || 'base').toLowerCase() === 'overlay')) : [];

          const renderOverlayRow = (o) => {
